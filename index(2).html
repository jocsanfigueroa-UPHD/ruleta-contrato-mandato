<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta Jurídica | Contrato de Mandato</title>

<style>
:root{
    --azul:#342c74;
    --azul-oscuro:#211d49;
    --dorado:#f4c414;
    --blanco:#ffffff;
    --gris:#f4f4f8;
    --verde:#159957;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,"Segoe UI",sans-serif;
    background:radial-gradient(circle at top,#51488f 0%,#342c74 40%,#17152d 100%);
    color:#222;
}

button,input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* ================= HEADER ================= */

.header{
    background:#fff;
    padding:15px 20px;
    box-shadow:0 5px 20px rgba(0,0,0,.20);
}

.header-content{
    max-width:1050px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    text-align:center;
}

.logo{
    width:95px;
    height:95px;
    object-fit:contain;
}

.header h1{
    margin:0;
    color:var(--azul);
    font-size:clamp(26px,4vw,38px);
}

.header h2{
    margin:5px 0;
    color:var(--dorado);
    font-size:clamp(18px,3vw,25px);
}

.header p{
    margin:0;
    color:#666;
}

/* ================= CONTENEDOR ================= */

.container{
    max-width:1050px;
    margin:22px auto;
    padding:0 15px;
}

.card{
    background:#fff;
    border-radius:20px;
    padding:24px;
    margin-bottom:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.20);
}

/* ================= CONFIGURACIÓN ================= */

#game{
    display:block;
}

.setup{
    text-align:center;
}

.setup h2{
    color:var(--azul);
    margin-top:0;
}

.players{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin:20px 0;
}

.player{
    background:#f7f7fa;
    border:2px solid #ddd;
    border-radius:12px;
    padding:13px;
}

.player label{
    display:block;
    color:var(--azul);
    font-size:12px;
    font-weight:bold;
    margin-bottom:7px;
}

.player input{
    width:100%;
    padding:12px;
    border:2px solid #ddd;
    border-radius:9px;
    outline:none;
    font-size:15px;
}

.player input:focus{
    border-color:var(--dorado);
}

.primary{
    border:0;
    background:var(--dorado);
    color:var(--azul-oscuro);
    padding:14px 25px;
    border-radius:12px;
    font-weight:bold;
    font-size:16px;
}

.primary:hover{
    background:#ffd52e;
}

/* ================= SELECCIÓN ================= */

.select-title{
    text-align:center;
}

.select-title h2{
    color:var(--azul);
    margin:0 0 5px;
}

.select-title p{
    color:#666;
    margin-top:5px;
}

.select-buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:18px;
}

.select-player{
    border:2px solid #ddd;
    background:#f7f7fa;
    color:var(--azul);
    padding:14px 8px;
    border-radius:12px;
    font-weight:bold;
}

.select-player:hover{
    border-color:var(--dorado);
}

.select-player.active{
    background:var(--dorado);
    border-color:var(--dorado);
    color:var(--azul-oscuro);
    box-shadow:0 4px 12px rgba(244,196,20,.35);
}

.selected-message{
    text-align:center;
    color:var(--azul);
    font-weight:bold;
    margin:14px 0 0;
}

/* ================= RULETA ================= */

.game-area{
    text-align:center;
}

.wheel-wrap{
    position:relative;
    width:min(560px,90vw);
    aspect-ratio:1;
    margin:25px auto;
}

.wheel{
    width:100%;
    height:100%;
    border-radius:50%;
    transition:transform 4.2s cubic-bezier(.12,.8,.18,1);
    filter:drop-shadow(0 10px 15px rgba(0,0,0,.38));
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

.pointer{
    position:absolute;
    z-index:5;
    left:50%;
    top:-5px;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:22px solid transparent;
    border-right:22px solid transparent;
    border-top:45px solid var(--dorado);
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));
}

.center{
    position:absolute;
    z-index:4;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:92px;
    height:92px;
    border-radius:50%;
    background:#fff;
    border:6px solid var(--dorado);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--azul);
    font-weight:900;
    font-size:13px;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
}

#spinBtn{
    border:0;
    background:var(--dorado);
    color:var(--azul-oscuro);
    padding:16px 35px;
    border-radius:13px;
    font-size:19px;
    font-weight:bold;
    min-width:260px;
}

#spinBtn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* ================= PREGUNTA ================= */

.question-result{
    display:none;
    max-width:850px;
    margin:25px auto 0;
    background:var(--gris);
    border-left:7px solid var(--dorado);
    border-radius:15px;
    padding:22px;
    text-align:left;
}

.question-result .player{
    background:transparent;
    border:0;
    padding:0;
    font-size:18px;
    color:#555;
}

.question-number{
    color:var(--azul);
    font-weight:bold;
    margin-top:8px;
}

.question-text{
    color:var(--azul);
    font-size:21px;
    line-height:1.5;
    font-weight:bold;
    margin:12px 0 0;
}

.answer{
    display:none;
    margin-top:18px;
    background:#e1f5e9;
    border:2px solid var(--verde);
    color:#126b3d;
    border-radius:12px;
    padding:16px;
    line-height:1.5;
}

.actions{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-top:18px;
}

.secondary{
    border:0;
    background:var(--azul);
    color:#fff;
    padding:12px 18px;
    border-radius:10px;
    font-weight:bold;
}

.secondary:hover{
    background:#453b91;
}

.counter{
    color:#777;
    font-size:13px;
    text-align:center;
    margin-top:12px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:850px){
    .players,
    .select-buttons{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .header-content{
        flex-direction:column;
        gap:7px;
    }

    .logo{
        width:75px;
        height:75px;
    }

    .card{
        padding:16px;
    }

    .players,
    .select-buttons{
        grid-template-columns:1fr;
    }

    .question-text{
        font-size:18px;
    }

    #spinBtn{
        width:100%;
        min-width:0;
    }

    .center{
        width:70px;
        height:70px;
        font-size:10px;
        border-width:4px;
    }

    .pointer{
        border-left-width:16px;
        border-right-width:16px;
        border-top-width:34px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-content">

        <!-- Coloca logo-uph.png junto a index.html -->
        <img
            src="logo-uph.png"
            onerror="this.onerror=null;this.src='logo_uph.png';"
            alt="Universidad Politécnica de Honduras"
            class="logo"
        >

        <div>
            <h1>⚖️ Ruleta Jurídica</h1>
            <h2>Contrato de Mandato</h2>
            <p>Concurso interactivo</p>
        </div>

    </div>
</header>

<main class="container">

    <!-- ================= JUEGO ================= -->

    <section class="card" id="game">

        <div class="game-area">

            <!-- ================= UNA SOLA RULETA ================= -->

            <div class="wheel-wrap">

                <div class="pointer"></div>

                <div class="wheel" id="wheel">

                    <canvas
                        id="canvas"
                        width="600"
                        height="600">
                    </canvas>

                    <div class="center">
                        10<br>PREGUNTAS
                    </div>

                </div>

            </div>

            <button
                id="spinBtn"
                onclick="spin()"
                disabled>
                🎯 GIRAR RULETA
            </button>


            <!-- ================= RESULTADO ================= -->

            <div class="question-result" id="questionResult">

                <div class="player" id="resultPlayer">
                    👤 Responde:
                </div>

                <div class="question-number" id="questionNumber">
                    Pregunta
                </div>

                <div class="question-text" id="questionText">
                </div>

                <div class="answer" id="answer">
                </div>

                <div class="actions">

                    <button
                        class="secondary"
                        id="showAnswerBtn"
                        onclick="showAnswer()">
                        👁️ Mostrar respuesta
                    </button>

                    <button
                        class="secondary"
                        onclick="newQuestion()">
                        🔄 Nueva pregunta
                    </button>

                </div>

            </div>

            <div class="counter" id="counter">
                Preguntas utilizadas: 0 de 10
            </div>

        </div>

    </section>

</main>


<script>

/* =========================================================
   LAS 10 PREGUNTAS
   La ruleta tiene 10 espacios:
   P1, P2, P3 ... P10.
   Ustedes seleccionan al participante.
   La ruleta selecciona la pregunta.
========================================================= */

const questions = [

    {
        q:"¿Qué es el contrato de mandato según el artículo 1888 del Código Civil de Honduras?",
        o:[
            "Un contrato laboral.",
            "Un contrato mediante el cual una persona realiza una gestión, acto o negocio por cuenta y encargo de otra.",
            "Una compraventa.",
            "Una donación."
        ],
        c:1
    },

    {
        q:"¿Quién es el mandante?",
        o:[
            "La persona que ejecuta el encargo.",
            "La persona que confiere el encargo, poder o autorización.",
            "Un tercero.",
            "El juez."
        ],
        c:1
    },

    {
        q:"¿Quién es el mandatario?",
        o:[
            "La persona que acepta y ejecuta el encargo.",
            "La persona que otorga el poder.",
            "El beneficiario.",
            "El notario."
        ],
        c:0
    },

    {
        q:"¿Qué caracteriza al mandato especial?",
        o:[
            "Comprende todos los asuntos del mandante.",
            "Se limita a uno o varios negocios específicos y determinados.",
            "Siempre es verbal.",
            "No tiene límites."
        ],
        c:1
    },

    {
        q:"¿En qué se fundamenta principalmente el contrato de mandato?",
        o:[
            "En la confianza entre las partes.",
            "En una multa.",
            "En una sentencia.",
            "En una compraventa."
        ],
        c:0
    },

    {
        q:"¿Cuál es un requisito del contrato de mandato?",
        o:[
            "Consentimiento.",
            "Quiebra.",
            "Revocación.",
            "Interdicción."
        ],
        c:0
    },

    {
        q:"¿Qué debe hacer el mandatario respecto de su gestión?",
        o:[
            "Ocultar información.",
            "Rendir cuentas.",
            "Vender todos los bienes.",
            "Cambiar las instrucciones."
        ],
        c:1
    },

    {
        q:"¿Qué obligación tiene el mandante respecto de los gastos?",
        o:[
            "Ignorarlos.",
            "Reembolsar los gastos efectuados en cumplimiento de la gestión.",
            "Cobrarlos al mandatario.",
            "Duplicarlos."
        ],
        c:1
    },

    {
        q:"¿Cuál es una causa de terminación del mandato?",
        o:[
            "Revocación.",
            "Aumento de confianza.",
            "Una reunión.",
            "Un pago."
        ],
        c:0
    },

    {
        q:"En el ejemplo del exceso de facultades, ¿qué hizo José sin autorización expresa?",
        o:[
            "Cobró alquileres.",
            "Administró la propiedad.",
            "Vendió el inmueble.",
            "Pagó servicios."
        ],
        c:2
    }

];


/* =========================================================
   VARIABLES
========================================================= */

let usedQuestions = [];
let spinning = false;
let rotation = 0;
let currentQuestionIndex = null;


/* =========================================================
   COLORES DE LA RULETA
========================================================= */

const colors = [
    "#f4c414",
    "#342c74",
    "#2d86bc",
    "#7b4aa8",
    "#d99127",
    "#4f8a70",
    "#b44c65",
    "#5969a8",
    "#b886c9",
    "#3d6e9e"
];


/* =========================================================
   DIBUJAR UNA SOLA RULETA CON LAS 10 PREGUNTAS
========================================================= */

function drawWheel(){

    const canvas =
        document.getElementById("canvas");

    const ctx =
        canvas.getContext("2d");

    const cx = 300;
    const cy = 300;
    const radius = 285;

    const slice =
        (2 * Math.PI) / questions.length;

    ctx.clearRect(
        0,
        0,
        600,
        600
    );


    questions.forEach((question,index)=>{

        const start =
            index * slice;

        const end =
            start + slice;


        ctx.beginPath();

        ctx.moveTo(cx,cy);

        ctx.arc(
            cx,
            cy,
            radius,
            start,
            end
        );

        ctx.closePath();

        ctx.fillStyle =
            colors[index];

        ctx.fill();

        ctx.strokeStyle =
            "#ffffff";

        ctx.lineWidth = 3;

        ctx.stroke();


        /* Número de pregunta */

        ctx.save();

        ctx.translate(
            cx,
            cy
        );

        ctx.rotate(
            start + slice / 2
        );

        ctx.textAlign =
            "right";

        ctx.fillStyle =
            (index === 0 ||
             index === 4 ||
             index === 8)
            ? "#222"
            : "#fff";

        ctx.font =
            "bold 28px Arial";

        ctx.fillText(
            "P" + (index + 1),
            270,
            10
        );

        ctx.restore();

    });

}

drawWheel();


/* =========================================================
   INICIAR JUEGO
========================================================= */

function startGame(){

    players = [];

    for(let i=1;i<=4;i++){

        const value =
            document
                .getElementById("p"+i)
                .value
                .trim();

        if(value !== ""){
            players.push(value);
        }

    }


    if(players.length < 1){

        alert(
            "Ingrese al menos un participante."
        );

        return;
    }


    selectedPlayer = null;

    usedQuestions = [];

    currentQuestionIndex = null;

    spinning = false;

    rotation = 0;


    document
        .getElementById("setup")
        .style.display = "none";

    document
        .getElementById("game")
        .style.display = "block";


    document
        .getElementById("wheel")
        .style.transform =
        "rotate(0deg)";


    document
        .getElementById("questionResult")
        .style.display = "none";


    renderPlayers();

    updateCounter();

}


/* =========================================================
   MOSTRAR PARTICIPANTES PARA SELECCIÓN MANUAL
========================================================= */

function renderPlayers(){

    const container =
        document.getElementById(
            "selectButtons"
        );

    container.innerHTML = "";


    players.forEach((name,index)=>{

        const button =
            document.createElement("button");

        button.className =
            "select-player";

        button.textContent =
            "👤 " + name;


        button.onclick = function(){

            if(spinning){
                return;
            }


            selectedPlayer =
                index;


            document
                .querySelectorAll(
                    ".select-player"
                )
                .forEach(btn =>
                    btn.classList.remove(
                        "active"
                    )
                );


            button.classList.add(
                "active"
            );


            document
                .getElementById(
                    "selectedMessage"
                )
                .textContent =
                "👤 La pregunta será para: " +
                name;


            /*
                La ruleta solamente puede girar
                cuando hay una persona seleccionada.
            */

            document
                .getElementById(
                    "spinBtn"
                )
                .disabled = false;

        };


        container.appendChild(button);

    });

}


/* =========================================================
   GIRAR LA RULETA
========================================================= */

function spin(){

    if(
        spinning ||
        selectedPlayer === null
    ){
        return;
    }


    if(
        usedQuestions.length >=
        questions.length
    ){

        alert(
            "Ya se utilizaron las 10 preguntas."
        );

        return;
    }


    spinning = true;


    const spinButton =
        document.getElementById(
            "spinBtn"
        );

    spinButton.disabled = true;

    spinButton.textContent =
        "🎡 GIRANDO...";


    /*
        Elegir una pregunta que todavía
        no haya salido.
    */

    const available =
        questions
            .map((q,index)=>index)
            .filter(index =>
                !usedQuestions.includes(index)
            );


    const selectedIndex =
        available[
            Math.floor(
                Math.random() *
                available.length
            )
        ];


    currentQuestionIndex =
        selectedIndex;


    /*
        Calcular el giro para que
        la pregunta seleccionada quede
        exactamente bajo la flecha.
    */

    const slice =
        360 / questions.length;


    const target =
        -90 -
        (
            selectedIndex * slice
        ) -
        (slice / 2);


    const current =
        rotation % 360;


    let difference =
        target - current;


    while(difference < 0){
        difference += 360;
    }


    const extraSpins =
        360 *
        (5 + Math.floor(
            Math.random() * 3
        ));


    rotation +=
        extraSpins +
        difference;


    document
        .getElementById("wheel")
        .style.transform =
        `rotate(${rotation}deg)`;


    setTimeout(()=>{

        spinning = false;

        usedQuestions.push(
            selectedIndex
        );

        showQuestion(
            selectedIndex
        );

    },4300);

}


/* =========================================================
   MOSTRAR PREGUNTA
========================================================= */

function showQuestion(index){

    const question =
        questions[index];

    document
        .getElementById(
            "resultPlayer"
        )
        .textContent =
        "👤 Pregunta seleccionada";


    document
        .getElementById(
            "questionNumber"
        )
        .textContent =
        "Pregunta " +
        (index + 1);


    document
        .getElementById(
            "questionText"
        )
        .textContent =
        question.q;


    /*
        Mostrar las respuestas
        para que puedan leerlas.
        NO se asignan puntos.
    */

    const answer =
        document.getElementById(
            "answer"
        );

    answer.innerHTML =
        "<b>✅ Respuesta correcta:</b><br>" +
        question.o[question.c];

    answer.style.display =
        "none";


    document
        .getElementById(
            "questionResult"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "showAnswerBtn"
        )
        .disabled = false;


    updateCounter();

}


/* =========================================================
   MOSTRAR RESPUESTA
========================================================= */

function showAnswer(){

    document
        .getElementById(
            "answer"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "showAnswerBtn"
        )
        .disabled = true;

}


/* =========================================================
   NUEVA PREGUNTA
========================================================= */

function newQuestion(){

    /*
        NO cambiamos automáticamente
        de participante.

        Ustedes vuelven a seleccionar
        quién responderá.
    */

    currentQuestionIndex = null;


    document
        .getElementById(
            "questionResult"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "showAnswerBtn"
        )
        .disabled = true;


    document
        .getElementById(
            "selectedMessage"
        )
        .textContent =
        "Seleccione quién responderá la siguiente pregunta";


    document
        .querySelectorAll(
            ".select-player"
        )
        .forEach(btn =>
            btn.classList.remove(
                "active"
            )
        );


    selectedPlayer = null;


    if(
        usedQuestions.length <
        questions.length
    ){

        document
            .getElementById(
                "spinBtn"
            )
            .disabled = true;

        document
            .getElementById(
                "spinBtn"
            )
            .textContent =
            "🎯 GIRAR RULETA";

    }

    else{

        document
            .getElementById(
                "spinBtn"
            )
            .disabled = true;

        document
            .getElementById(
                "spinBtn"
            )
            .textContent =
            "🏁 PREGUNTAS TERMINADAS";

    }


    updateCounter();

}


/* =========================================================
   CONTADOR
========================================================= */

function updateCounter(){

    document
        .getElementById(
            "counter"
        )
        .textContent =
        "Preguntas utilizadas: " +
        usedQuestions.length +
        " de " +
        questions.length;

}

</script>

</body>
</html>
